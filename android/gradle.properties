# Everything stays inside D:\TopCashSQL (temporary files included).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/TopCashSQL/.runtime/tmp -Duser.home=D:/TopCashSQL/.tools/home
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Compile Kotlin inside the Gradle daemon: no separate Kotlin daemon writing to %LOCALAPPDATA%.
kotlin.compiler.execution.strategy=in-process
